[pytest]
testpaths = tests
pythonpath = backend tests
addopts = -q --strict-markers
# A browser scenario that waits on an element the page never renders used to
# block the job until the runner gave up. Fail the scenario instead.
timeout = 300
timeout_method = thread
markers =
    e2e: browser end-to-end tests (need OL_TEST_BASE_URL and Playwright)
    security: OWASP-oriented security checks
filterwarnings =
    ignore::DeprecationWarning
