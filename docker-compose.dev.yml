# Local overlay: publish the app directly so `http://localhost:8080` works
# without a reverse proxy, and add the browser test runner.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm tests

services:
  app:
    ports:
      - "8080:8000"

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    image: openlearn-tests:latest
    depends_on:
      - app
    # Chromium now upgrades a plain-http navigation to https on its own, so
    # "http://app:8000" becomes a TLS handshake against a plain HTTP port and
    # every scenario dies with net::ERR_SSL_PROTOCOL_ERROR. A loopback address is
    # a trustworthy origin and is left alone, so the browser shares the
    # application's network namespace and talks to it on 127.0.0.1.
    network_mode: "service:app"
    environment:
      OL_TEST_BASE_URL: http://127.0.0.1:8000
    command: ["pytest", "-ra", "tests"]
