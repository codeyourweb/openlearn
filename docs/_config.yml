title: OpenLearn
tagline: A wiki and quizzes for learning, free and accessible
description: >-
  OpenLearn is a free learning platform: a collaborative wiki, a quiz engine and spaced
  repetition, self-hostable, WCAG 2.2 AA accessible and available in twelve languages.
url: "https://codeyourweb.github.io"
baseurl: "/openlearn"
lang: en
author:
  name: Jean-Pierre GARNIER
  url: "https://github.com/codeyourweb"
repository: codeyourweb/openlearn
demo_url: "https://openlearnproject.org"
license: AGPL-3.0-only

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - ACCESSIBILITY.md
  - ADMINISTRATION.md
  - DEPLOYMENT.md
  - MCP.md

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/og-openlearn.png
