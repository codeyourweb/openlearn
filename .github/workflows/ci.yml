name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Fast, dependency-light checks: a pull request learns about a broken import
  # or a missing translation in under a minute, before the database matrix runs.
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          # The rule set lives in pyproject.toml, not here: bump the pin
          # deliberately, then run `ruff check backend tests` before pushing.
          pip install ruff==0.17.4 shellcheck-py==0.10.0.1

      - name: Python lint
        run: ruff check backend tests

      - name: Shell lint
        run: shellcheck run.sh serve.sh

      - name: Install runtime dependencies
        run: |
          # pytest lives in requirements-dev.txt, like everywhere else in this
          # repository: the static suites below need it, and a second pin here
          # would be a second thing to keep true.
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Static suites (locales, language declarations, frontend imports)
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_locale_coverage.py tests/test_language_declarations.py tests/test_frontend_modules.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript syntax
        run: |
          set -e
          find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "all modules parse"

  # The application speaks to SQLAlchemy, not to a particular engine: the same
  # suite has to pass on the three supported backends.
  tests-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Test
        env:
          PYTHONPATH: backend
          OL_DATABASE_URL: sqlite:///./data/ci.db
        run: |
          mkdir -p data
          pytest tests -q -m "not e2e" \
            --cov=backend/app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-sqlite
          path: coverage.xml

  tests-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openlearn
          POSTGRES_PASSWORD: openlearn
          POSTGRES_DB: openlearn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openlearn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Test
        env:
          PYTHONPATH: backend
          OL_DATABASE_URL: postgresql+psycopg://openlearn:openlearn@127.0.0.1:5432/openlearn
        run: pytest tests -q -m "not e2e"

  tests-mysql:
    name: Tests (MariaDB)
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11
        env:
          MARIADB_USER: openlearn
          MARIADB_PASSWORD: openlearn
          MARIADB_DATABASE: openlearn
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Test
        env:
          PYTHONPATH: backend
          OL_DATABASE_URL: mysql+pymysql://openlearn:openlearn@127.0.0.1:3306/openlearn?charset=utf8mb4
        run: pytest tests -q -m "not e2e"

  # The browser suite drives the real interface against a built image: the bugs
  # it catches are exactly the ones a unit test cannot see.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      # The `tests` service lives in the dev override and behind a profile:
      # without these two lines `docker compose run ... tests` answers
      # "no such service: tests", which is exactly what the first run did.
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
      COMPOSE_PROFILES: test
      OL_ADMIN_EMAIL: admin@example.com
      OL_ADMIN_PASSWORD: ChangeMe123!
      OL_DEMO_PASSWORD: DemoPassw0rd!
      OL_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null; then
              echo "ready after ${i} attempts"; exit 0
            fi
            sleep 2
          done
          docker compose logs --tail 120
          exit 1
      - name: Browser tests
        run: |
          docker compose build tests
          docker compose run --rm -e OL_TEST_BASE_URL=http://app:8000 tests
      - name: Accessibility audit (axe-core)
        run: docker compose run --rm -e OL_TEST_BASE_URL=http://app:8000 tests pytest -q tests/test_accessibility.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: openlearn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 18000:8000 \
            -e OL_SECRET_KEY=ci-smoke-key -e OL_SEED_DEMO_DATA=false openlearn:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18000/api/v1/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:18000/api/v1/meta | head -c 400
          docker logs smoke --tail 40
          docker rm -f smoke

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit bandit
          # Reported for information: a transitive CVE without a fix must not
          # block a pull request that does not touch it.
          pip-audit -r backend/requirements.txt || true
      - name: Static analysis
        run: bandit -q -r backend/app -x backend/app/demo || true
